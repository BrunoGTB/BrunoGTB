name: Gerar cobrinha

on:
  schedule: # a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7231e0&color_dots=#ebedf0,#d9c6f5,#b48cff,#8b5cf6,#612c7f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d78564&color_dots=#161b22,#341d3c,#612c7f,#7231e0,#a274ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
