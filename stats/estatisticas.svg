<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Estatísticas do GitHub">
  <title>Estatísticas do GitHub</title>
  <defs>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#612c7f"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d78564"/><stop offset="0.45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#612c7f"/>
    </linearGradient>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170d19"/><stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .titulo { font-size: 17px; font-weight: 700; fill: #a274ff; }
    .rotulo { font-size: 13px; fill: #9d8fae; }
    .valor { font-size: 13px; font-weight: 700; fill: #ece6f5; }
    .grande { font-size: 26px; font-weight: 800; fill: #ece6f5; }
    .pequeno { font-size: 11px; fill: #9d8fae; }
    .surge { animation: surgir .5s ease-out backwards; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes desenhar { from { stroke-dashoffset: var(--total); } }
    @keyframes crescer { from { transform: scaleX(0); } }
  </style>
  <rect x="0.5" y="0.5" width="494" height="209" rx="12" fill="url(#fundo)" stroke="#341d3c"/>
  <rect x="0.5" y="0.5" width="4" height="209" rx="2" fill="url(#acento)"/>
  <text x="26" y="36" class="titulo">Estatísticas no GitHub</text>
  <g fill="#8b5cf6" opacity="0.55" shape-rendering="crispEdges">
    <rect x="461" y="18" width="3" height="9"/><rect x="458" y="21" width="9" height="3"/>
    <rect x="441" y="32" width="2" height="6"/><rect x="439" y="34" width="6" height="2"/>
  </g>
  <g class="surge" style="animation-delay:150ms"><rect x="26" y="58" width="6" height="6" fill="#d78564" shape-rendering="crispEdges"/><text x="42" y="66" class="rotulo">Commits no último ano</text><text x="290" y="66" class="valor" text-anchor="end">122</text></g>
  <g class="surge" style="animation-delay:270ms"><rect x="26" y="82" width="6" height="6" fill="#d78564" shape-rendering="crispEdges"/><text x="42" y="90" class="rotulo">Pull requests</text><text x="290" y="90" class="valor" text-anchor="end">10</text></g>
  <g class="surge" style="animation-delay:390ms"><rect x="26" y="106" width="6" height="6" fill="#d78564" shape-rendering="crispEdges"/><text x="42" y="114" class="rotulo">Repositórios públicos</text><text x="290" y="114" class="valor" text-anchor="end">8</text></g>
  <g class="surge" style="animation-delay:510ms"><rect x="26" y="130" width="6" height="6" fill="#d78564" shape-rendering="crispEdges"/><text x="42" y="138" class="rotulo">Seguidores</text><text x="290" y="138" class="valor" text-anchor="end">5</text></g>
  <g class="surge" style="animation-delay:630ms"><rect x="26" y="154" width="6" height="6" fill="#d78564" shape-rendering="crispEdges"/><text x="42" y="162" class="rotulo">Estrelas recebidas</text><text x="290" y="162" class="valor" text-anchor="end">0</text></g>
  <g class="surge" style="animation-delay:200ms">
    <circle cx="395" cy="104" r="50" fill="none" stroke="#221430" stroke-width="9"/>
    <circle cx="395" cy="104" r="50" fill="none" stroke="url(#anel)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="314.2" stroke-dashoffset="194.5" transform="rotate(-90 395 104)"
      style="--total:314.2; animation: desenhar 1.2s ease-out"/>
    <text x="395" y="108" class="grande" text-anchor="middle">139</text>
    <text x="395" y="126" class="pequeno" text-anchor="middle">contribuições</text>
    <text x="395" y="178" class="pequeno" text-anchor="middle">no último ano</text>
  </g>
  <text x="26" y="194" class="pequeno">No GitHub desde 2020</text>
</svg>
