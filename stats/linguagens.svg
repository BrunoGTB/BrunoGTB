<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Linguagens mais usadas">
  <title>Linguagens mais usadas</title>
  <defs>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#612c7f"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d78564"/><stop offset="0.45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#612c7f"/>
    </linearGradient>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170d19"/><stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .titulo { font-size: 17px; font-weight: 700; fill: #a274ff; }
    .rotulo { font-size: 13px; fill: #9d8fae; }
    .valor { font-size: 13px; font-weight: 700; fill: #ece6f5; }
    .grande { font-size: 26px; font-weight: 800; fill: #ece6f5; }
    .pequeno { font-size: 11px; fill: #9d8fae; }
    .surge { animation: surgir .5s ease-out backwards; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes desenhar { from { stroke-dashoffset: var(--total); } }
    @keyframes crescer { from { transform: scaleX(0); } }
  </style>
  <rect x="0.5" y="0.5" width="494" height="209" rx="12" fill="url(#fundo)" stroke="#341d3c"/>
  <rect x="0.5" y="0.5" width="4" height="209" rx="2" fill="url(#acento)"/>
  <text x="26" y="36" class="titulo">Linguagens mais usadas</text>
  <g fill="#8b5cf6" opacity="0.55" shape-rendering="crispEdges">
    <rect x="461" y="18" width="3" height="9"/><rect x="458" y="21" width="9" height="3"/>
    <rect x="441" y="32" width="2" height="6"/><rect x="439" y="34" width="6" height="2"/>
  </g>
  <clipPath id="barra"><rect x="26" y="58" width="443" height="10" rx="5"/></clipPath>
  <g clip-path="url(#barra)" style="transform-origin:26px 0; animation: crescer .9s ease-out">
    <rect x="26.00" y="58" width="140.22" height="10" fill="#f1e05a"/>
    <rect x="165.72" y="58" width="83.57" height="10" fill="#e34c26"/>
    <rect x="248.79" y="58" width="66.01" height="10" fill="#663399"/>
    <rect x="314.30" y="58" width="56.88" height="10" fill="#b07219"/>
    <rect x="370.68" y="58" width="50.85" height="10" fill="#3572A5"/>
    <rect x="421.03" y="58" width="48.47" height="10" fill="#4F5D95"/>
  </g>
  <g class="surge" style="animation-delay:300ms"><circle cx="31" cy="96" r="5" fill="#f1e05a"/><text x="44" y="100" class="valor">JavaScript</text><text x="231" y="100" class="rotulo" text-anchor="end">31.5%</text></g>
  <g class="surge" style="animation-delay:390ms"><circle cx="261" cy="96" r="5" fill="#e34c26"/><text x="274" y="100" class="valor">HTML</text><text x="461" y="100" class="rotulo" text-anchor="end">18.8%</text></g>
  <g class="surge" style="animation-delay:480ms"><circle cx="31" cy="124" r="5" fill="#663399"/><text x="44" y="128" class="valor">CSS</text><text x="231" y="128" class="rotulo" text-anchor="end">14.8%</text></g>
  <g class="surge" style="animation-delay:570ms"><circle cx="261" cy="124" r="5" fill="#b07219"/><text x="274" y="128" class="valor">Java</text><text x="461" y="128" class="rotulo" text-anchor="end">12.7%</text></g>
  <g class="surge" style="animation-delay:660ms"><circle cx="31" cy="152" r="5" fill="#3572A5"/><text x="44" y="156" class="valor">Python</text><text x="231" y="156" class="rotulo" text-anchor="end">11.4%</text></g>
  <g class="surge" style="animation-delay:750ms"><circle cx="261" cy="152" r="5" fill="#4F5D95"/><text x="274" y="156" class="valor">PHP</text><text x="461" y="156" class="rotulo" text-anchor="end">10.8%</text></g>
</svg>
